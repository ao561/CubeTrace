[project]
name = "cubetrace"
version = "0.1.0"
description = "Analyse 3x3 Rubik's cube speedsolves (CFOP) from phone video"
authors = [
    { name = "Amaan Omar", email = "ao561@cam.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
cubetrace = "cubetrace.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
